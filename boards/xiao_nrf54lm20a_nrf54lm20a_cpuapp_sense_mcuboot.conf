CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SENSOR=y

CONFIG_BATTERY_USE_REG_LDO_MAPPING=y
CONFIG_LED_RGB_COLOR=y

CONFIG_SENSOR_IMU_DRIVERS_MINIMAL=y
CONFIG_SENSOR_DRV_LSM6DSM=y
CONFIG_SENSOR_MAG_DRIVERS_MINIMAL=y

CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# No native USB on this board: the USB-C connector is served by the onboard
# SAMD11 USB-UART bridge, and the nRF54 usbhs D+/D- pads are not connected on
# the PCB. The USB device stack has nothing to attach to, so keep it off and
# run the console over uart20 (the SAMD11 bridge, P1.11 TX / P1.10 RX).
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
# With no USB to trigger log backend enable (usb.c only enables it on USB
# connect), the UART log backend must autostart so printk/log reach uart20
# (the SAMD11 bridge) from boot.
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
