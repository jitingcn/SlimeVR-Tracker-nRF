CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SENSOR=y

CONFIG_BATTERY_USE_REG_LDO_MAPPING=y

# This board has a single GPIO user LED (P2.00); no PWM LED channels, so
# keep the RGB color mapping off and render status as on/off blink.
CONFIG_LED_RGB_COLOR=n

# Full IMU/magnetometer driver set (no SENSOR_*_DRIVERS_MINIMAL trim):
# the onboard IMU may be replaced pin-to-pin on i2c30, and the scan
# auto-detects whatever supported chip is populated (stock:
# LSM6DS3TR-C at 0x6a). The external mag connector (D4/D5 = i2c22) is
# scannable as well. See boards/xiao_nrf54l15_nrf54l15_cpuapp_sense.conf.

# Sense board IMU (i2c30) and magnetometer (i2c22) are both I2C; no SPI
# controller node is enabled. Disable the SPI subsystem so the empty
# drivers/spi Zephyr library warning does not appear.
CONFIG_SPI=n

CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# The nRF54L15 has no native USB controller and the USB-C connector is
# served by the onboard SAMD11 USB-UART bridge, so the USB device stack
# has nothing to attach to. Keep it off and run the console over uart20
# (the SAMD11 bridge, P1.09 TX / P1.08 RX).
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
# With no USB to trigger log backend enable (usb.c only enables it on USB
# connect), the UART log backend must autostart so printk/log reach uart20
# (the SAMD11 bridge) from boot.
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
