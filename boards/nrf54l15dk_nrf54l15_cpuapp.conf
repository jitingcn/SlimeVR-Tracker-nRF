# ESB requests constant-latency mode through the nrfx POWER driver.
CONFIG_NRFX_POWER=y

# No native USB, and this application's overlay disables uart20. Use RTT.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
