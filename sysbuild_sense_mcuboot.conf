# Sysbuild configuration for the XIAO nRF54L15 Sense MCUboot target
# (-DFILE_SUFFIX=sense_mcuboot). Identical to sysbuild_mcuboot.conf: the
# sense variant only changes the application image, not the bootloader.
# Kconfig fragments cannot include other files, so the content is
# duplicated here.
SB_CONFIG_PARTITION_MANAGER=n
SB_CONFIG_MERGED_HEX_FILES=y
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
