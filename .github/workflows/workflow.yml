on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  create:
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

jobs:
  build:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        boards: [
                  {boardname: "promicro_uf2/nrf52840/i2c", filename: "SlimeNRF_ProMicro_StackedSmol_Tracker_I2C"},
                  {boardname: "promicro_uf2/nrf52840/spi", filename: "SlimeNRF_ProMicro_StackedSmol_Tracker_SPI"},
                  {boardname: "promicro_uf2/nrf52840/default_spi", filename: "SlimeNRF_ProMicro_Tracker_SPI"},
                  {boardname: "styria_mini_uf2/nrf52840/spi", filename: "Styria_Mini_Tracker_SPI"},
                  {boardname: "styria_mini_uf2/nrf52840/i2c", filename: "Styria_Mini_Tracker_I2C"},
                  {boardname: "foxsmol40_uf2/nrf52840", filename: "FoxApplication_FoxSmol40_Tracker" },
                  {boardname: "foxsnacklite_uf2/nrf52840", filename: "FoxApplication_FoxSnackLite_Tracker" },
                  {boardname: "foxsnackeco_uf2/nrf52840", filename: "FoxApplication_FoxSnackECO_Tracker" },
                  {boardname: "foxsmolv1_spi_uf2/nrf52840", filename: "FoxApplication_FoxSmol_V1_SPI_Tracker" },
                  {boardname: "mochi_uf2/nrf52833", filename: "MOCHI_UF2"},

                ]
    if: always()
    runs-on: ubuntu-latest
    steps:

      - name: 🧹 Clean Landing Site
        run: |
          sudo rm -rf zephyr-workspace/SlimeNRF-CI
      - uses: actions/checkout@v5
        with:
          # Clone the repo to a subdirectory, so we can initialize the Zephyr
          # workspace in the parent directory.
          path: zephyr-workspace/SlimeNRF-CI
          submodules: recursive

      - name: 🧰 Install Dependencies + West
        # Install the Zephyr host build dependencies, and the `west` Python tool. This list is from
        # https://docs.zephyrproject.org/3.6.0/develop/getting_started/index.html#install-dependencies
        run: |
          sudo apt-get update && sudo apt install --no-install-recommends \
          git \
          cmake \
          ninja-build \
          gperf \
          ccache \
          dfu-util \
          device-tree-compiler \
          wget \
          python3-dev \
          python3-pip \
          python3-setuptools \
          python3-tk \
          python3-wheel \
          python3-venv \
          xz-utils \
          file \
          make \
          gcc \
          gcc-multilib \
          g++-multilib \
          libsdl2-dev \
          libmagic1

          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          # insert the PATH changes the venv activate made to be present for
          # future steps
          echo "PATH=$PATH" >> $GITHUB_ENV
          pip3 install west ninja

      - name: 🪁 Install Zephyr SDK
        # Fetch the Zephyr SDK from the GitHub Release artifact, unpack it and
        # run the setup script, selecting the '-c' option to install cmake
        # packages and the '-t arm-zephyr-eabi' option to install the toolchain
        # only for the arm-zephyr-eabi (Cortex-M) architecture, since we don't
        # need the other toolchains (xtensa, riscv, etc.)
        env:
          ZEPHYR_SDK_VERSION: 0.17.4
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${{ env.ZEPHYR_SDK_VERSION }}/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi

      - name: ♻️ Initialize Zephyr Workspace
        # Set up the Zephyr workspace and install the Python dependencies
        run: |
          cd zephyr-workspace
          sudo rm -rf .west
          west init -l SlimeNRF-CI
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: 🐍 Install Python Dependencies
        run: |
          cd zephyr-workspace
          pip3 install -r zephyr/scripts/requirements.txt

      - name: 🔨 Build SlimeVR-Tracker-nRF - ${{ matrix.boards.boardname }}
        if: always()
        run: |
          cd zephyr-workspace
          sudo rm -rf Releases
          mkdir -p Releases
          REPO_DIR="${{ github.event.repository.name }}"
          if [ ! -d "$REPO_DIR" ]; then
            echo "Repo dir not found: $REPO_DIR; fallback to SlimeNRF-CI"
            REPO_DIR="SlimeNRF-CI"
          fi
          sudo rm -rf "$REPO_DIR/build"
          mkdir -p "$REPO_DIR/build"
          west build \
              --board ${{ matrix.boards.boardname }} \
              --pristine=always "$REPO_DIR" \
              --build-dir "$REPO_DIR/build" \
              -- \
              -DNCS_TOOLCHAIN_VERSION=NONE \
              -DBOARD_ROOT=../"$REPO_DIR"

          for ext in uf2 hex; do
            src="$REPO_DIR/build/$REPO_DIR/zephyr/zephyr.${ext}"
            dst="Releases/${{ matrix.boards.filename }}.${ext}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Saved: $dst"
            else
              echo "Not found (skip): $src"
            fi
          done

      - name: 💾 Upload Artifact - ${{ matrix.boards.boardname }}
        if: always()
        uses: actions/upload-artifact@v5
        with:
          # Artifact name
          name: ${{ matrix.boards.filename }}
          if-no-files-found: warn
          # A file, directory or wildcard pattern that describes what to upload
          path: |
            zephyr-workspace/Releases/${{ matrix.boards.filename }}.uf2
            zephyr-workspace/Releases/${{ matrix.boards.filename }}.hex
