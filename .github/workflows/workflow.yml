on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  create:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

env:
  ZEPHYR_SDK_VERSION: "0.17.4"

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: zephyr-workspace/SlimeNRF-CI
          submodules: recursive

      - name: 🧰 Install Dependencies + West
        run: |
          sudo apt-get update && sudo apt install --no-install-recommends \
          git \
          cmake \
          ninja-build \
          gperf \
          ccache \
          dfu-util \
          device-tree-compiler \
          wget \
          python3-dev \
          python3-pip \
          python3-setuptools \
          python3-tk \
          python3-wheel \
          python3-venv \
          xz-utils \
          file \
          make \
          gcc \
          gcc-multilib \
          g++-multilib \
          libsdl2-dev \
          libmagic1

          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          echo "PATH=$PATH" >> $GITHUB_ENV
          pip3 install west ninja

      - name: 📦 Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}

      - name: 🪁 Install Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${{ env.ZEPHYR_SDK_VERSION }}/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi

      - name: 📦 Cache West Workspace
        id: cache-west
        uses: actions/cache@v4
        with:
          path: |
            zephyr-workspace/.west
            zephyr-workspace/zephyr
            zephyr-workspace/nrf
            zephyr-workspace/modules
            zephyr-workspace/nrfxlib
            zephyr-workspace/bootloader
            zephyr-workspace/tools
          key: west-workspace-${{ hashFiles('zephyr-workspace/SlimeNRF-CI/west.yml') }}

      - name: ♻️ Initialize Zephyr Workspace
        run: |
          cd zephyr-workspace
          if [ ! -d ".west" ]; then
            west init -l SlimeNRF-CI
          fi
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: pip-${{ hashFiles('zephyr-workspace/zephyr/scripts/requirements.txt') }}

      - name: 🐍 Install Python Dependencies
        run: |
          cd zephyr-workspace
          pip3 install -r zephyr/scripts/requirements.txt

  build:
    needs: setup
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        boards: [
                  {boardname: "promicro_uf2/nrf52840/i2c", filename: "SlimeNRF_ProMicro_StackedSmol_Tracker_I2C"},
                  {boardname: "promicro_uf2/nrf52840/spi", filename: "SlimeNRF_ProMicro_StackedSmol_Tracker_SPI"},
                  {boardname: "promicro_uf2/nrf52840/default_spi", filename: "SlimeNRF_ProMicro_Tracker_SPI"},
                  {boardname: "styria_mini_uf2/nrf52840/spi", filename: "Styria_Mini_Tracker_SPI"},
                  {boardname: "foxsmol40_uf2/nrf52840", filename: "FoxApplication_FoxSmol40_Tracker"},
                  {boardname: "foxsnacklite_uf2/nrf52840", filename: "FoxApplication_FoxSnackLite_Tracker"},
                  {boardname: "foxsnackeco_uf2/nrf52840", filename: "FoxApplication_FoxSnackECO_Tracker"},
                  {boardname: "foxsmolv1_spi_uf2/nrf52840", filename: "FoxApplication_FoxSmol_V1_SPI_Tracker"},
                  {boardname: "mochi_uf2/nrf52833", filename: "Mochi_Tracker"},
                ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: zephyr-workspace/SlimeNRF-CI
          submodules: recursive

      - name: 🧰 Install Dependencies + West
        run: |
          sudo apt-get update && sudo apt install --no-install-recommends \
          git cmake ninja-build gperf ccache device-tree-compiler wget \
          python3-dev python3-pip python3-setuptools python3-wheel python3-venv \
          xz-utils file make gcc gcc-multilib g++-multilib libmagic1

          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          echo "PATH=$PATH" >> $GITHUB_ENV
          pip3 install west ninja

      - name: 📦 Restore Zephyr SDK
        uses: actions/cache/restore@v4
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          fail-on-cache-miss: true

      - name: 🪁 Register Zephyr SDK
        run: |
          ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi

      - name: 📦 Restore West Workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            zephyr-workspace/.west
            zephyr-workspace/zephyr
            zephyr-workspace/nrf
            zephyr-workspace/modules
            zephyr-workspace/nrfxlib
            zephyr-workspace/bootloader
            zephyr-workspace/tools
          key: west-workspace-${{ hashFiles('zephyr-workspace/SlimeNRF-CI/west.yml') }}
          fail-on-cache-miss: true

      - name: ♻️ Register Zephyr Workspace
        run: |
          cd zephyr-workspace
          west zephyr-export

      - name: 📦 Restore pip packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.venv
          key: pip-${{ hashFiles('zephyr-workspace/zephyr/scripts/requirements.txt') }}
          fail-on-cache-miss: true

      - name: 📦 Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.boards.filename }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.boards.filename }}-

      - name: ⚙️ Configure ccache
        run: |
          ccache --set-config=max_size=400M
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache -z

      - name: 🔨 Build SlimeVR-Tracker-nRF - ${{ matrix.boards.boardname }}
        if: always()
        run: |
          cd zephyr-workspace
          sudo rm -rf Releases
          mkdir -p Releases
          REPO_DIR="${{ github.event.repository.name }}"
          if [ ! -d "$REPO_DIR" ]; then
            echo "Repo dir not found: $REPO_DIR; fallback to SlimeNRF-CI"
            REPO_DIR="SlimeNRF-CI"
          fi
          rm -rf "$REPO_DIR/build"
          west build \
              --board ${{ matrix.boards.boardname }} \
              --pristine=always "$REPO_DIR" \
              --build-dir "$REPO_DIR/build" \
              -- \
              -DNCS_TOOLCHAIN_VERSION=NONE \
              -DBOARD_ROOT=../"$REPO_DIR"

          for ext in uf2 hex; do
            src="$REPO_DIR/build/$REPO_DIR/zephyr/zephyr.${ext}"
            dst="Releases/${{ matrix.boards.filename }}.${ext}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Saved: $dst"
            else
              echo "Not found (skip): $src"
            fi
          done
          ccache -s

      - name: 💾 Upload Artifact - ${{ matrix.boards.boardname }}
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.boards.filename }}
          if-no-files-found: warn
          path: |
            zephyr-workspace/Releases/${{ matrix.boards.filename }}.uf2
            zephyr-workspace/Releases/${{ matrix.boards.filename }}.hex
